name: TikTok LIVE alert
on:
  schedule:
    - cron: "*/10 * * * *"   # check every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      force:
        description: "Tick to post the LIVE message now without checking TikTok"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: state-file
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bot.py live ${{ inputs.force && '--force' || '' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          LIVE_TOPIC_ID: ${{ secrets.LIVE_TOPIC_ID }}
          TIKTOK_USER: bo.alwafa
      - name: Remember this LIVE so it is not posted twice
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "live state" && git push)
